# Personal modifications to upstream services defined in docker-compose.yml.
# This file is NEVER touched by upstream — merge conflicts are impossible here.
#
# Upstream merge workflow:
#   git fetch upstream
#   git checkout master && git merge upstream/master
#   git checkout my-compose-overrides && git merge master
#   → Conflicts isolated to docker-compose.yml only (minimal personal changes there)
#   → Review this file if upstream changed a service you override here.

services:

  # ─── Traefik ──────────────────────────────────────────────────────────────
  # Changes vs upstream:
  #   - Image bumped to 3.4
  #   - CF_DNS_API_TOKEN / CF_ZONE_API_TOKEN env var names (Cloudflare plugin requires these)
  #   - Dashboard enabled (--api.insecure + --api.dashboard)
  #   - Debug log level
  #   - Port 8199 → Traefik insecure API/dashboard on host
  #   - Subdomain routing for dashboard via Traefik itself
  #   - Homepage widget
  traefik:
    image: ghcr.io/traefik/traefik:3.4
    environment:
      # Traefik's Cloudflare DNS plugin expects CF_* names, not CLOUDFLARE_*
      CF_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN}
      CF_ZONE_API_TOKEN: ${CLOUDFLARE_ZONE_API_TOKEN}
    # Full command replacement (compose merges replace the entire 'command' key)
    command:
      - --log.level=DEBUG
      - --log.format=text
      - --ping=true
      - --api.insecure=true
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web-secure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=web-secure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --experimental.plugins.rewrite-body.modulename=github.com/packruler/rewrite-body
      - --experimental.plugins.rewrite-body.version=v1.2.0
      - --experimental.plugins.rewriteHeaders.modulename=github.com/XciD/traefik-plugin-rewrite-headers
      - --experimental.plugins.rewriteHeaders.version=v0.0.3
      - --certificatesresolvers.myresolver.acme.dnschallenge=${DNS_CHALLENGE:-true}
      - --certificatesresolvers.myresolver.acme.dnschallenge.provider=${DNS_CHALLENGE_PROVIDER:-cloudflare}
      - --certificatesresolvers.myresolver.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --certificatesresolvers.myresolver.acme.caserver=${LETS_ENCRYPT_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.myresolver.acme.email=${LETS_ENCRYPT_EMAIL}
      - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
    ports:
      - "8199:8080"   # Traefik insecure API/dashboard — reachable on LAN at host:8199
    healthcheck:
      interval: 1m
    labels:
      traefik.enable: "true"
      traefik.http.routers.traefik-dashboard.rule: "Host(`traefik.${BASE_HOSTNAME}`)"
      traefik.http.routers.traefik-dashboard.service: "api@internal"
      traefik.http.routers.traefik-dashboard.entrypoints: "web-secure"
      traefik.http.routers.traefik-dashboard.tls: "true"
      traefik.http.routers.traefik-dashboard.tls.certresolver: "myresolver"
      # Homepage
      homepage.group: "Network"
      homepage.name: "Traefik"
      homepage.icon: "traefik.png"
      homepage.href: "https://traefik.${BASE_HOSTNAME}"
      homepage.description: "Reverse proxy dashboard"
      homepage.weight: "0"
      homepage.widget.type: "traefik"
      homepage.widget.url: "http://traefik:8080"

  # ─── Jellyfin ─────────────────────────────────────────────────────────────
  # Changes vs upstream:
  #   - AMD GPU passthrough (/dev/dri) + DOCKER_MODS for AMD HW acceleration
  #   - Dedicated subdomain instead of /jellyfin path prefix
  #   - Port 8096 exposed directly on host for LAN clients
  #   - Healthcheck URL fixed (no /jellyfin path prefix)
  #   - JELLYFIN_PublishedServerUrl updated to subdomain
  jellyfin:
    environment:
      JELLYFIN_PublishedServerUrl: "https://jellyfin.${BASE_HOSTNAME}"
      DOCKER_MODS: "linuxserver/mods:jellyfin-amd"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0
    ports:
      - "8096:8096"
      - "1901:1900/udp"  # 1900 held by homeassistant (network_mode: host)
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8096/health"]
      interval: 1m
    labels:
      # Subdomain routing (replaces upstream's path-prefix /jellyfin rule)
      traefik.http.routers.jellyfin.rule: "Host(`jellyfin.${BASE_HOSTNAME}`)"
      traefik.http.routers.jellyfin.entrypoints: "web-secure"
      traefik.http.routers.jellyfin.tls: "true"
      traefik.http.routers.jellyfin.tls.certresolver: "myresolver"
      traefik.http.services.jellyfin.loadbalancer.server.port: "8096"
      # Clear upstream's path-prefix middleware (not needed for subdomain routing)
      traefik.http.routers.jellyfin.middlewares: ""
      # Homepage
      homepage.href: "https://jellyfin.${BASE_HOSTNAME}"
      homepage.widget.url: "http://jellyfin:8096"

  # ─── Seerr ────────────────────────────────────────────────────────────────
  # Changes vs upstream:
  #   - Dedicated subdomain (SEERR_HOSTNAME) instead of path-prefix routing
  #   - All rewrite-body/rewriteHeaders middleware dropped (subdomain needs none)
  seerr:
    healthcheck:
      interval: 1m
    labels:
      # Subdomain routing
      traefik.http.routers.seerr.rule: "Host(`${SEERR_HOSTNAME}`)"
      traefik.http.routers.seerr.tls: "true"
      traefik.http.routers.seerr.tls.certresolver: "myresolver"
      traefik.http.services.seerr.loadbalancer.server.port: "5055"
      # Disable all middleware from upstream's path-prefix setup
      traefik.http.routers.seerr.middlewares: ""
      # Homepage
      homepage.href: "https://${SEERR_HOSTNAME}"
      homepage.widget.url: "http://seerr:5055"

  # ─── Calibre-Web ──────────────────────────────────────────────────────────
  # Changes vs upstream:
  #   - Route on LOCAL_HOSTNAME (LAN-only access) instead of public HOSTNAME
  calibre-web:
    labels:
      traefik.http.routers.calibre.rule: "Host(`${LOCAL_HOSTNAME}`) && PathPrefix(`/calibre`)"

  # ─── Homepage ─────────────────────────────────────────────────────────────
  # Changes vs upstream:
  #   - Additional SSD mount so both storages appear in disk usage widgets
  #     /data      → /mnt/nas1  (HDD/NAS, from base via DATA_ROOT)
  #     /data/ssd  → /mnt/data  (SSD, added here)
  homepage:
    volumes:
      - /mnt/data:/data/ssd

  # ─── Healthcheck interval bumps ───────────────────────────────────────────
  # Upstream uses 30s; bumped to 1m to reduce log noise on a stable homeserver.
  sonarr:
    healthcheck:
      interval: 1m
  radarr:
    healthcheck:
      interval: 1m
  lidarr:
    healthcheck:
      interval: 1m
  bazarr:
    healthcheck:
      interval: 1m
  prowlarr:
    healthcheck:
      interval: 1m
