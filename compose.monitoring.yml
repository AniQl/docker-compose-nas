# Monitoring / Observability stack
# Services: Netdata, Prometheus, Grafana, Grafana Image Renderer, Grafana Discord Daily
#
# Required .env vars:
#   GRAFANA_ADMIN_PASSWORD   — Grafana admin password
#   GRAFANA_TOKEN            — Grafana service account token (for Discord reporter)
#   DISCORD_WEBHOOK_URL      — Discord webhook for daily panel posts
#   GRAFANA_DASH_UID         — Dashboard UID to render panels from
#   GRAFANA_PANEL_IDS        — Comma-separated panel IDs, or "all"
#   SERVER_IP                — LAN IP of the host (for direct-port homepage links)

services:

  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    cpu_shares: 90
    pid: host
    security_opt:
      - apparmor:unconfined
    group_add:
      - "${DOCKER_GID:-983}"   # host docker group GID — set DOCKER_GID in .env
    volumes:
      - ${CONFIG_ROOT:-.}/netdata/config:/etc/netdata
      - ${CONFIG_ROOT:-.}/netdata/lib:/var/lib/netdata
      - ${CONFIG_ROOT:-.}/netdata/cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "19999:19999"
    labels:
      homepage.group: "Network"
      homepage.name: "Netdata"
      homepage.icon: "netdata.png"
      homepage.href: "http://${SERVER_IP}:19999"
      homepage.description: "Real-time performance monitoring"
      homepage.weight: "2"
      homepage.widget.type: "netdata"
      homepage.widget.url: "http://${SERVER_IP}:19999"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ${CONFIG_ROOT:-.}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${CONFIG_ROOT:-.}/prometheus/data:/prometheus
    depends_on:
      - netdata
    labels:
      traefik.enable: "true"
      traefik.http.routers.prometheus.rule: "Host(`prometheus.${BASE_HOSTNAME}`)"
      traefik.http.routers.prometheus.entrypoints: "web-secure"
      traefik.http.routers.prometheus.tls: "true"
      traefik.http.routers.prometheus.tls.certresolver: "myresolver"
      traefik.http.services.prometheus.loadbalancer.server.port: "9090"
      # Homepage
      homepage.group: "Network"
      homepage.name: "Prometheus"
      homepage.icon: "prometheus.png"
      homepage.href: "https://prometheus.${BASE_HOSTNAME}"
      homepage.description: "Metrics backend"
      homepage.weight: "7"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_RENDERING_SERVER_URL: "http://grafana-image-renderer:8081/render"
      GF_RENDERING_CALLBACK_URL: "http://grafana:3000/"
      GF_RENDERING_RENDERER_TOKEN: "${GRAFANA_RENDERER_TOKEN}"
    volumes:
      - ${CONFIG_ROOT:-.}/grafana/data:/var/lib/grafana
      - ${CONFIG_ROOT:-.}/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - grafana-image-renderer
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: "Host(`grafana.${BASE_HOSTNAME}`)"
      traefik.http.routers.grafana.entrypoints: "web-secure"
      traefik.http.routers.grafana.tls: "true"
      traefik.http.routers.grafana.tls.certresolver: "myresolver"
      traefik.http.services.grafana.loadbalancer.server.port: "3000"
      # Homepage
      homepage.group: "Network"
      homepage.name: "Grafana"
      homepage.icon: "grafana.png"
      homepage.href: "https://grafana.${BASE_HOSTNAME}"
      homepage.description: "Metrics dashboards"
      homepage.weight: "6"
      homepage.widget.type: "grafana"
      homepage.widget.url: "http://grafana:3000"
      homepage.widget.username: "admin"
      homepage.widget.password: "${GRAFANA_ADMIN_PASSWORD}"

  grafana-image-renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: grafana-image-renderer
    restart: unless-stopped
    environment:
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "8081"
      AUTH_TOKEN: "${GRAFANA_RENDERER_TOKEN}"

  grafana-discord-daily:
    image: python:3.12-slim
    container_name: grafana-discord-daily
    restart: unless-stopped
    environment:
      TZ: "${TIMEZONE}"
      GRAFANA_URL: "http://grafana:3000"
      GRAFANA_TOKEN: "${GRAFANA_TOKEN}"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL}"
      DASH_UID: "${GRAFANA_DASH_UID}"
      PANEL_IDS: "${GRAFANA_PANEL_IDS:-all}"
      FROM: "now-12h"
      TO: "now"
    volumes:
      - ${CONFIG_ROOT:-.}/grafana-discord-daily:/app
    working_dir: /app
    command: >
      bash -lc "
        set -e;
        apt-get update &&
        apt-get install -y --no-install-recommends cron ca-certificates &&
        pip install --no-cache-dir requests &&

        {
          echo 'SHELL=/bin/sh'
          echo 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
          echo \"TZ=$$TZ\"
          echo \"GRAFANA_URL=$$GRAFANA_URL\"
          echo \"GRAFANA_TOKEN=$$GRAFANA_TOKEN\"
          echo \"DISCORD_WEBHOOK_URL=$$DISCORD_WEBHOOK_URL\"
          echo \"DASH_UID=$$DASH_UID\"
          echo \"PANEL_IDS=$$PANEL_IDS\"
          echo \"FROM=$$FROM\"
          echo \"TO=$$TO\"
          echo '0 0,12 * * * root /usr/local/bin/python3 /app/post.py >> /app/cron.log 2>&1'
        } > /etc/cron.d/post &&

        chmod 0644 /etc/cron.d/post &&
        cron -f
      "
    depends_on:
      - grafana
