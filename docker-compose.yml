  asterisk:
    image: mlan/asterisk:full    # or :base / :mini; full includes console audio support
    container_name: asterisk
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE}
      # Optional: reuse Traefik ACME certs for SIP-TLS
      - ACME_FILE=/acme/acme.json
      - HOSTNAME=pbx.${HOSTNAME}
      # Optional: logging verbosity (0..8)
      - SYSLOG_LEVEL=4
      # Optional: enable host audio passthrough later if you want (see README)
      # - PULSE_SERVER=unix:/run/pulse/socket
      # - PULSE_COOKIE=/run/pulse/cookie
    ports:
      - "5060:5060/udp"                # SIP UDP
      - "5060:5060/tcp"                # SIP TCP
      - "5061:5061/tcp"                # SIP TLS (if you enable it)
      - "10000-10099:10000-10099/udp"  # RTP (adjust range if you like)
    # If you want AutoBan (nftables), uncomment:
    # cap_add:
    #   - NET_ADMIN
    #   - NET_RAW
    volumes:
      # Persistent config/state consolidated under /srv (nice for backups)
      - ${CONFIG_ROOT:-.}/asterisk:/srv
      # Share Traefik's ACME store so Asterisk can extract SIP TLS certs
      - ${CONFIG_ROOT:-.}/letsencrypt:/acme:ro
      # Optional: host audio via PulseAudio (only if you need it)
      # - ./pulse:/run/pulse:rshared
      - /etc/localtime:/etc/localtime:ro
    networks:
      - default  
  wgeasy:
    image: ghcr.io/wg-easy/wg-easy:nightly
    container_name: wgeasy
    restart: unless-stopped

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1

    volumes:
      - ${CONFIG_ROOT:-.}/wg-easy:/etc/wireguard

    # WireGuard (UDP) must be exposed directly (Traefik does not proxy this)
    # ports:
    #   - "51820:51820/udp"
    #network_mode: host

    # If you also want LAN access to the UI by port, uncomment:
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"

    environment:
      - WG_POST_UP=iptables -t nat -A POSTROUTING -s 10.8.0.0/24 -o eth0 -j MASQUERADE; iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT
      - WG_POST_DOWN=iptables -t nat -D POSTROUTING -s 10.8.0.0/24 -o eth0 -j MASQUERADE; iptables -D FORWARD -i %i -j ACCEPT; iptables -D FORWARD -o %i -j ACCEPT

      - WG_ALLOWED_IPS=0.0.0.0/0,::/0
      - WG_DEFAULT_DNS=1.1.1.1,8.8.8.8


      - TZ=${TIMEZONE}

      # This is what clients connect to (set it to your public DNS name)
      - WG_HOST=wg.${HOSTNAME}
      - WG_PORT=51820

      # wg-easy UI listens on this port inside the container
      - PORT=51821

      # Helps mobile clients stay connected on LTE/Wi-Fi changes
      - WG_PERSISTENT_KEEPALIVE=25

      # Initial UI login (store password in .env)
      - INIT_ENABLED=true
      - INIT_USERNAME=admin
      - INIT_PASSWORD=${WGEASY_UI_PASSWORD}
      - ENABLE_PROMETHEUS_METRICS=true

    labels:
      - traefik.enable=true
      - traefik.http.routers.wgeasy.rule=Host(`wg-ui.${HOSTNAME}`)
      - traefik.http.routers.wgeasy.entrypoints=web-secure
      - traefik.http.routers.wgeasy.tls=true
      - traefik.http.routers.wgeasy.tls.certresolver=myresolver
      - traefik.http.services.wgeasy.loadbalancer.server.port=51821

      # Homepage
      - homepage.href=https://wg-ui.${HOSTNAME}

      # Homepage autodiscovery + widget
      - homepage.group=Network
      - homepage.name=WireGuard VPN
      - homepage.icon=wireguard.png
      - homepage.description=VPN access to home
      - homepage.weight=3
      - homepage.widget.type=wgeasy
      # - homepage.widget.url=https://wg-ui.${HOSTNAME}
      - homepage.widget.url=http://wgeasy:51821
      - homepage.widget.version=2
      - homepage.widget.username=admin
      - homepage.widget.password=${WGEASY_UI_PASSWORD}
      - homepage.widget.threshold=2
