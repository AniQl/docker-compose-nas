  grafana-discord-daily:
    image: python:3.12-slim
    container_name: grafana-discord-daily
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE}
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_TOKEN=${GRAFANA_TOKEN}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - DASH_UID=${GRAFANA_DASH_UID}
      - PANEL_IDS=${GRAFANA_PANEL_IDS:-all}
      - FROM=now-12h
      - TO=now
    volumes:
      - /DATA/AppData/GrafanaDiscordDaily:/app
    working_dir: /app
    command: >
      bash -lc "
        set -e;
        apt-get update &&
        apt-get install -y --no-install-recommends cron ca-certificates &&
        pip install --no-cache-dir requests &&

        {
          echo 'SHELL=/bin/sh'
          echo 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
          echo \"TZ=$$TZ\"
          echo \"GRAFANA_URL=$$GRAFANA_URL\"
          echo \"GRAFANA_TOKEN=$$GRAFANA_TOKEN\"
          echo \"DISCORD_WEBHOOK_URL=$$DISCORD_WEBHOOK_URL\"
          echo \"DASH_UID=$$DASH_UID\"
          echo \"PANEL_IDS=$$PANEL_IDS\"
          echo \"FROM=$$FROM\"
          echo \"TO=$$TO\"
          echo '0 0,12 * * * root /usr/local/bin/python3 /app/post.py >> /app/cron.log 2>&1'
        } > /etc/cron.d/post &&

        chmod 0644 /etc/cron.d/post &&
        cron -f
      "
    depends_on:
      - grafana
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    restart: unless-stopped

    devices:
      - /dev/dri:/dev/dri

    shm_size: "512mb"

    environment:
      - TZ=${TIMEZONE}
      - LIBVA_DRIVER_NAME=radeonsi

    volumes:
      - ${CONFIG_ROOT:-.}/frigate:/config
      - ${NAS1_ROOT:-/DATA}/frigate:/media/frigate
      - /etc/localtime:/etc/localtime:ro

    expose:
      - "5000"

    labels:
      # ── Traefik ─────────────────────────────
      - traefik.enable=true
      - traefik.http.routers.frigate.rule=Host(`cam.${HOSTNAME}`)
      - traefik.http.routers.frigate.entrypoints=web-secure
      - traefik.http.routers.frigate.tls=true
      - traefik.http.routers.frigate.tls.certresolver=myresolver
      - traefik.http.services.frigate.loadbalancer.server.port=5000

      # ── Homepage ────────────────────────────
      - homepage.group=Security
      - homepage.name=Frigate
      - homepage.icon=frigate.png
      - homepage.href=https://cam.${HOSTNAME}
      - homepage.description=AI NVR (VAAPI decode on AMD)
      - homepage.weight=1
      - homepage.widget.type=frigate
      - homepage.widget.url=http://frigate:5000


networks:
  default:
    name: docker-compose-nas

volumes:
  ollama-data:
  openwebui-data:
  mqtt-config:
  mqtt-data:
  mqtt-log:
  nextcloud-data:
  nextcloud-db-data:
  redis-data:
