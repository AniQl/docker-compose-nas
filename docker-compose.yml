services:
  nextcloud-db:
    image: mariadb:10.11
    container_name: nextcloud-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${NEXTCLOUD_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=${NEXTCLOUD_DB_USER}
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
    volumes:
      - nextcloud-db-data:/var/lib/mysql

  ## ─────────────────────────────────────────────
  ## 2) Redis for Nextcloud caching & locking
  ## ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    # (optional) persist the Redis dataset if you like
    volumes:
      - redis-data:/data

  ## ─────────────────────────────────────────────
  ## 3) Nextcloud
  ## ─────────────────────────────────────────────
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      - nextcloud-db
      - redis
    environment:
      - NEXTCLOUD_MOUNT=/mnt/
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=${NEXTCLOUD_DB_USER}
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - TZ=${TIMEZONE}
      - NEXTCLOUD_TRUSTED_PROXIES=traefik
      - NEXTCLOUD_TRUSTED_DOMAINS=nc.${HOSTNAME}
      # Redis settings:
      - REDIS_HOST=redis
      - REDIS_HOST_PORT=6379
      # - REDIS_HOST_PASSWORD=${REDIS_PASSWORD}   # if you set one
    volumes:
      - nextcloud-data:/var/www/html
      - /mnt/data:/mnt/data:rw
      - /mnt/nas1:/mnt/nas1:rw
      - /home:/home_angelo:rw
      #- /home:/mnt/host-home:ro
      #- /mnt:/mnt/host-mnt:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.nextcloud.rule=Host(`nc.${HOSTNAME}`)
      - traefik.http.routers.nextcloud.entrypoints=web-secure
      - traefik.http.routers.nextcloud.tls=true
      - traefik.http.routers.nextcloud.tls.certresolver=myresolver
      - traefik.http.services.nextcloud.loadbalancer.server.port=80
      - homepage.group=Cloud
      - homepage.name=Nextcloud
      - homepage.icon=nextcloud.png
      - homepage.href=https://nc.${HOSTNAME}
      - homepage.description=Self-hosted cloud storage & collaboration
      - homepage.weight=3
      - homepage.widget.type=nextcloud
      - homepage.widget.url=https://nc.${HOSTNAME}
      - homepage.widget.username=admin
      - homepage.widget.password=NEXTCLOUD_PASSWORD_REDACTED
  stalled-download-cleaner:
    build: https://github.com/MattDGTL/sonarr-radarr-queue-cleaner.git
    container_name: stalled-download-cleaner
    restart: unless-stopped
    environment:
     - SONARR_URL=http://sonarr:8989/sonarr
     - SONARR_API_KEY=${SONARR_API_KEY}
     - RADARR_URL=http://radarr:7878/radarr
     - RADARR_API_KEY=${RADARR_API_KEY}
     - API_TIMEOUT=6000
  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    cpu_shares: 90
    pid: host
    #network_mode: bridge
    security_opt:
      - apparmor:unconfined

    # 1) Add the host docker group inside the container:
    group_add:
      - "983"

    # 2) Mount your config directory as read-write (so Netdata can bootstrap it).
    volumes:
      - /DATA/AppData/Netdata/config:/etc/netdata      # ← no :ro
      - /DATA/AppData/Netdata/lib:/var/lib/netdata
      - /DATA/AppData/Netdata/cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "19999"
    ports:
      - "19999:19999"
    labels:
    #   # Traefik routing
    #   - traefik.enable=true
    #   - traefik.http.routers.netdata.rule=(Host(`${HOSTNAME}`) && PathPrefix(`/netdata`))
    #   - traefik.http.routers.netdata.entrypoints=web-secure
    #   - traefik.http.routers.netdata.tls=true
    #   - traefik.http.routers.netdata.tls.certresolver=myresolver
    #   - traefik.http.routers.netdata.middlewares=strip-netdata
    #   - traefik.http.middlewares.strip-netdata.stripprefix.prefixes=/netdata
    #   - traefik.http.services.netdata.loadbalancer.server.port=19999

      # Homepage autodiscovery
      - homepage.group=Network
      - homepage.name=Netdata
      - homepage.icon=netdata.png
      - homepage.href=http://${SERVER_IP}:19999
      - homepage.description=Real-time performance monitoring
      - homepage.weight=2
      - homepage.widget.type=netdata
      - homepage.widget.url=http://${SERVER_IP}:19999
  portainerr:
    image: portainer/portainer-ce:2.21.1
    container_name: portainerr
    restart: unless-stopped
    volumes:
      - /DATA/AppData/portainer:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "9000"    # internal Portainer HTTP port
      - "9443"    # internal Portainer HTTPS port
    ports:
      - "9000:9000"
    labels:
      # Traefik routing
      # - traefik.enable=true
      # - traefik.http.routers.portainer.rule=(Host(`${HOSTNAME}`) && PathPrefix(`/portainer`))
      # - traefik.http.routers.portainer.entrypoints=web-secure
      # - traefik.http.routers.portainer.tls=true
      # - traefik.http.routers.portainer.tls.certresolver=myresolver
      # - traefik.http.services.portainer.loadbalancer.server.port=9000

      # Homepage autodiscovery
      - homepage.group=Network
      - homepage.name=Portainer
      - homepage.icon=portainer.png
      - homepage.href=http://${SERVER_IP}:9000
      - homepage.description=Lightweight Docker management UI
      - homepage.weight=1
      - homepage.widget.type=portainer
      - homepage.widget.url=http://${SERVER_IP}:9000
      - homepage.widget.key=PORTAINER_API_KEY_REDACTED
      - homepage.widget.env=2
  # … the rest of your services … 
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    restart: unless-stopped
    environment:
      # - APP_URL=https://speedtest.${BASE_HOSTNAME}
      # - ASSET_URL=https://speedtest.${BASE_HOSTNAME}
      - PUID=${USER_ID}                         # match your host user
      - PGID=${GROUP_ID}                        # match your host group
      - TZ=${TIMEZONE}                          # e.g. Europe/Warsaw
      - APP_KEY=base64:L2LLPjOLwu874QJjHSl2gYHgVPpQueOzoa0cD4PRAis=            # generate one at https://speedtest-tracker.dev :contentReference[oaicite:0]{index=0}
      - SPEEDTEST_SCHEDULE=0 */1 * * *         # every 12 hours; cron format :contentReference[oaicite:1]{index=1}
      # optionally:
      # - APP_URL=http://your.domain/speedtest  # if you need external links to work
      - SPEEDTEST_SERVERS=40180        # restrict to specific Ookla server IDs
    volumes:
      - ${CONFIG_ROOT:-.}/speedtest-tracker:/config
    ports:
      - "9010:80"                               # host:container
    labels:
      # (optional) if you front it with Traefik
      # - traefik.enable=true
      # - traefik.http.routers.speedtest.rule=Host(`https://speedtest.${BASE_HOSTNAME}`)
      # - traefik.http.services.speedtest.loadbalancer.server.port=80

      # Homepage autodiscovery
      - homepage.group=Network
      - homepage.name=Speedtest
      - homepage.icon=speedtest-tracker.png
      - homepage.href=http://${SERVER_IP}:9010/
      - homepage.description=ISP speed monitoring
      - homepage.weight=5
      - homepage.widget.type=speedtest          # widget type as per docs :contentReference[oaicite:2]{index=2}
      - homepage.widget.url=http://${SERVER_IP}:9010/
      - homepage.widget.version=2               # use version 2 for linuxserver.io image >= 1.2.1
      - homepage.widget.key=SPEEDTEST_API_KEY_REDACTED
      - homepage.widget.bitratePrecision=3

  samba:
    image: elswork/samba
    environment:
      TZ: 'Europe/Madrid'
    networks:
      - default
    ports:
      - "139:139"
      - "445:445"
    restart: unless-stopped
    volumes:
      - /mnt:/share/folder
      #- /path/to/be/shared:/share/folder
    command: '-u "1000:1000:pirate:pirate:SAMBA_PASSWORD_REDACTED" -s "SmbShare:/share/folder:rw:pirate"'
  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: ghcr.io/koenkk/zigbee2mqtt
    restart: always
    volumes:
        - ./data:/app/data
        - /run/udev:/run/udev:ro
    ports:
        # Frontend port
        - 8088:8080
        - 8089:8089
    environment:
        - TZ=Europe/Berlin
    devices:
        # Make sure this matched your adapter location
        - /dev/ttyUSB0:/dev/ttyUSB0
    labels:
      # Group & display settings
        - homepage.group=Home Automation
        - homepage.name=Zigbee2MQTT
        - homepage.icon=zigbee2mqtt.png
        - homepage.href=http://${SERVER_IP}:8089/
        - homepage.description=Your Zigbee2MQTT web UI
        - homepage.weight=6
  mqtt:
    container_name: mqtt
    restart: always
    image: eclipse-mosquitto
    # environment:
    #     - PUID=1883
    #     - PGID=1883
    ports:
        - 1883:1883
        - 9001:9001
    volumes:
        - ${CONFIG_ROOT:-.}/mqtt/config:/mosquitto/config:rw
        - ${CONFIG_ROOT:-.}/mqtt/data:/mosquitto/data:rw
        - ${CONFIG_ROOT:-.}/mqtt/log:/mosquitto/log:rw
  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:8
    container_name: matter-server
    restart: unless-stopped
    # use host network so Matter can do mDNS & binds to 5580 directly
    network_mode: "host"
    # persist pairing/fabric state
    volumes:
      - ${CONFIG_ROOT:-.}/matter-data:/data
    environment:
      - WS_PORT=5580
  ollama:
    image: ollama/ollama:rocm
    container_name: ollama
    restart: unless-stopped
    # make your AMD GPU available inside the container
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    environment:
      # override Navi 22 (6700 XT) into gfx1030 so Ollama will load
      - HSA_OVERRIDE_GFX_VERSION=10.3.0
      - HCC_AMDGPU_TARGET=gfx1030
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    ports:
      - "11434:11434"
    labels:
      - traefik.enable=true
      - traefik.http.routers.ollama.rule=(Host(`${HOSTNAME}`) && PathPrefix(`/ollama`))
      - traefik.http.routers.ollama.entrypoints=web-secure
      - traefik.http.routers.ollama.tls=true
      - traefik.http.routers.ollama.tls.certresolver=myresolver
      - traefik.http.services.ollama.loadbalancer.server.port=11434
      - traefik.http.routers.ollama.middlewares=ollama-strip
      - traefik.http.middlewares.ollama-strip.stripPrefix.prefixes=/ollama

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      # point WebUI at the internal Ollama API
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=False
    volumes:
      - openwebui-data:/app/backend/data
    ports:
      - "8080:8080"
    # expose:
    #  - "8080"
    # # NIE DZIALA BO NIE MA BASE URL....
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.open-webui.rule=Host(`ai.${HOSTNAME}`)"
    #   - "traefik.http.routers.open-webui.entrypoints=web-secure"
    #   - "traefik.http.routers.open-webui.tls=true"
    #   - "traefik.http.routers.open-webui.tls.certresolver=myresolver"
    #   - "traefik.http.services.open-webui.loadbalancer.server.port=8080"
    #   - traefik.http.routers.webui.middlewares=webui-strip
    #   - traefik.http.middlewares.webui-strip.stripPrefix.prefixes=/webui
  
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    dns:
      - 1.1.1.1
      - 8.8.8.8
    command:
      - --config
      - /etc/cloudflared/config.yml
      - tunnel
      - run
    # Mount only the config and the credentials file, both read-only
    volumes:
      - ${CLOUDFLARED_DIR}/config.yml:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARED_DIR}/tunnel-credentials.json:/etc/cloudflared/CLOUDFLARE_TUNNEL_ID_REDACTED.json:ro
    depends_on:
      - traefik
    labels:
      # group it under “Network” on your homepage
      - homepage.group=Network
      # the display name & icon
      - homepage.name=Cloudflare Tunnel
      - homepage.icon=https://raw.githubusercontent.com/homarr-labs/dashboard-icons/refs/heads/main/svg/cloudflare.svg
      # link out to Cloudflare Zero Trust dashboard
      - homepage.href=https://one.dash.cloudflare.com/CLOUDFLARE_ACCOUNT_ID_REDACTED/home/quick-start
      - homepage.description=Shows your tunnel status via Cloudflare API
      - homepage.weight=4
      # widget config
      - homepage.widget.type=cloudflared
      - homepage.widget.accountid=CLOUDFLARE_ACCOUNT_ID_REDACTED
      - homepage.widget.tunnelid=CLOUDFLARE_TUNNEL_ID_REDACTED
      - homepage.widget.key=${CLOUDFLARE_DNS_API_TOKEN}
  traefik:
    image: ghcr.io/traefik/traefik:3.4
    container_name: traefik
    restart: always
    environment:
      - CLOUDFLARE_EMAIL=${CLOUDFLARE_EMAIL}
      - CF_DNS_API_TOKEN=${CLOUDFLARE_DNS_API_TOKEN}
      - CF_ZONE_API_TOKEN=${CLOUDFLARE_ZONE_API_TOKEN}
      - LETS_ENCRYPT_EMAIL=${LETS_ENCRYPT_EMAIL}
    command:
      - --log.level=DEBUG       # change to DEBUG for more verbosity
      - --log.format=text  
      - --ping=true
      - --api.insecure=true
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web-secure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=web-secure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --experimental.plugins.rewrite-body.modulename=github.com/packruler/rewrite-body
      - --experimental.plugins.rewrite-body.version=v1.2.0
      - --experimental.plugins.rewriteHeaders.modulename=github.com/XciD/traefik-plugin-rewrite-headers
      - --experimental.plugins.rewriteHeaders.version=v0.0.3
      - --certificatesresolvers.myresolver.acme.dnschallenge=${DNS_CHALLENGE:-true}
      - --certificatesresolvers.myresolver.acme.dnschallenge.provider=${DNS_CHALLENGE_PROVIDER:-cloudflare}
      - --certificatesresolvers.myresolver.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --certificatesresolvers.myresolver.acme.caserver=${LETS_ENCRYPT_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.myresolver.acme.email=${LETS_ENCRYPT_EMAIL}
      - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
    labels:
      # Traefik’s own dashboard (internal service)
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${HOSTNAME}`)"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.entrypoints=https"
      - traefik.http.routers.traefik-dashboard.entrypoints=web-secure
      - traefik.http.routers.traefik-dashboard.tls.certresolver=myresolver
      - traefik.http.services.traefik-dashboard.loadbalancer.server.port=8096

      # Homepage autodiscovery
      - homepage.group=Network
      - homepage.name=Traefik
      - homepage.icon=traefik.png
      - homepage.href=https://traefik.${HOSTNAME}
      - homepage.description=Reverse proxy dashboard
      - homepage.weight=0

      # Use the official Traefik widget
      - homepage.widget.type=traefik
      - homepage.widget.url=http://traefik:8080   
    ports:
      - "80:80"
      - "443:443"
      - "8199:8080"
    volumes:
      - ${CONFIG_ROOT:-.}/letsencrypt:/letsencrypt
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    extra_hosts:
      - host.docker.internal:172.17.0.1
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 1m
      retries: 10
  sonarr:
    image: lscr.io/linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
    volumes:
      - ${CONFIG_ROOT:-.}/sonarr:/config
      - ${NAS1_ROOT}:/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8989/sonarr/ping"]
      interval: 1m
      retries: 10
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=(Host(`${HOSTNAME}`) && PathPrefix(`/sonarr`))
      - traefik.http.routers.sonarr.tls=true
      - traefik.http.routers.sonarr.tls.certresolver=myresolver
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
      - homepage.group=Media
      - homepage.name=Sonarr
      - homepage.icon=sonarr.png
      - homepage.href=/sonarr
      - homepage.description=Series management
      - homepage.weight=0
      - homepage.widget.type=sonarr
      - homepage.widget.url=http://sonarr:8989/sonarr
      - homepage.widget.key=${SONARR_API_KEY}
  radarr:
    image: lscr.io/linuxserver/radarr
    container_name: radarr
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
    volumes:
      - ${CONFIG_ROOT:-.}/radarr:/config
      - ${NAS1_ROOT}:/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:7878/radarr/ping"]
      interval: 1m
      retries: 10
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=(Host(`${HOSTNAME}`) && PathPrefix(`/radarr`))
      - traefik.http.routers.radarr.tls=true
      - traefik.http.routers.radarr.tls.certresolver=myresolver
      - traefik.http.services.radarr.loadbalancer.server.port=7878
      - homepage.group=Media
      - homepage.name=Radarr
      - homepage.icon=radarr.png
      - homepage.href=/radarr
      - homepage.description=Movies management
      - homepage.weight=1
      - homepage.widget.type=radarr
      - homepage.widget.url=http://radarr:7878/radarr
      - homepage.widget.key=${RADARR_API_KEY}
  lidarr:
    image: lscr.io/linuxserver/lidarr
    container_name: lidarr
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
    volumes:
      - ${CONFIG_ROOT:-.}/lidarr:/config
      - ${NAS1_ROOT}:/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8686/lidarr/ping"]
      interval: 1m
      retries: 10
    labels:
      - traefik.enable=true
      - traefik.http.routers.lidarr.rule=(Host(`${HOSTNAME}`) && PathPrefix(`/lidarr`))
      - traefik.http.routers.lidarr.tls=true
      - traefik.http.routers.lidarr.tls.certresolver=myresolver
      - traefik.http.services.lidarr.loadbalancer.server.port=8686
      - homepage.group=Media
      - homepage.name=Lidarr
      - homepage.icon=lidarr.png
      - homepage.href=/lidarr
      - homepage.description=Music management
      - homepage.weight=2
      - homepage.widget.type=lidarr
      - homepage.widget.url=http://lidarr:8686/lidarr
      - homepage.widget.key=${LIDARR_API_KEY}
    profiles:
      - lidarr
  bazarr:
    image: lscr.io/linuxserver/bazarr
    container_name: bazarr
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
    volumes:
      - ${CONFIG_ROOT:-.}/bazarr/config:/config
      - ${NAS1_ROOT}:/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:6767/bazarr/ping"]
      interval: 1m
      retries: 10
    labels:
      - traefik.enable=true
      - traefik.http.routers.bazarr.rule=(Host(`${HOSTNAME}`) && PathPrefix(`/bazarr`))
      - traefik.http.routers.bazarr.tls=true
      - traefik.http.routers.bazarr.tls.certresolver=myresolver
      - traefik.http.services.bazarr.loadbalancer.server.port=6767
      - homepage.group=Download
      - homepage.name=Bazarr
      - homepage.icon=bazarr.png
      - homepage.href=/bazarr
      - homepage.description=Subtitles management
      - homepage.weight=4
      - homepage.widget.type=bazarr
      - homepage.widget.url=http://bazarr:6767/bazarr
      - homepage.widget.key=${BAZARR_API_KEY}
  jellyseerr:
    image: ghcr.io/fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TIMEZONE}
    volumes:
      - ${CONFIG_ROOT:-.}/jellyseerr:/app/config
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "http://127.0.0.1:5055/api/v1/status",
          "-qO",
          "/dev/null",
        ]
      interval: 1m
      retries: 10
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyseerr.rule=(Host(`${JELLYSEERR_HOSTNAME}`))
      - traefik.http.routers.jellyseerr.tls=true
      - traefik.http.routers.jellyseerr.tls.certresolver=myresolver
      - traefik.http.services.jellyseerr.loadbalancer.server.port=5055
      - homepage.group=Media
      - homepage.name=JellySeerr
      - homepage.icon=jellyseerr.png
      - homepage.href=https://${JELLYSEERR_HOSTNAME}
      - homepage.description=Content Recommendations and Request Management
      - homepage.weight=3
      - homepage.widget.type=jellyseerr
      - homepage.widget.url=http://jellyseerr:5055
      - homepage.widget.key=${JELLYSEERR_API_KEY}
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=${TIMEZONE}
    volumes:
      - ${CONFIG_ROOT:-.}/prowlarr:/config
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9696/prowlarr/ping"]
      interval: 1m
      retries: 10
    labels:
